
name: Construire APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les dépendances
        run: npm install

       - name: Ajouter Android si nécessaire
        run: |
          if [ ! -d android ]; then
          npx cap add android
          fi
      - name: Synchroniser Capacitor
        run: npx cap sync android
      - name: Compiler APK
        run: |
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: liberte-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
